name: Go-Seek Desktop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run React Unit & Telemetry Tests
      run: npm test -- --watchAll=false

    - name: Build Optimized Production Bundle
      run: npm run build
      env:
        GENERATE_SOURCEMAP: false

    - name: Security Check - Verify No Public Source Maps
      run: |
        MAP_COUNT=$(find build/ -name "*.map" | wc -l)
        if [ "$MAP_COUNT" -gt 0 ]; then
          echo "Security Failure: Found $MAP_COUNT exposed .map files in production build!"
          exit 1
        fi
        echo "Security Passed: Zero source map files found in production bundle."
